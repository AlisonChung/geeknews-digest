<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Digest Files</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  /* 디자인 토큰 — 단일 강조색(blue-500), cool-grey 중성색, 큰 라운드, 평면 표면 */
  :root {
    --blue-500: oklch(0.620 0.191 258);
    --blue-50:  oklch(0.959 0.020 250);
    --grey-900: oklch(0.237 0.020 258);
    --grey-800: oklch(0.357 0.028 257);
    --grey-700: oklch(0.460 0.028 256);
    --grey-600: oklch(0.562 0.025 254);
    --grey-500: oklch(0.666 0.021 253);
    --grey-400: oklch(0.779 0.016 251);
    --grey-200: oklch(0.930 0.005 248);
    --grey-100: oklch(0.966 0.003 248);
    --background: oklch(1 0 0);
    --grey-background: var(--grey-100);
    --layered: oklch(1 0 0);
    --hairline: var(--grey-200);
    --press: oklch(0 0 0 / 0.06);
    --shadow-1: 0 1px 2px oklch(0.155 0.060 261 / 0.04), 0 1px 1px oklch(0.155 0.060 261 / 0.04);

    --font: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", Roboto, sans-serif;
    --ease: cubic-bezier(0.22, 0.61, 0.36, 1);
    --dur-fast: 120ms;
    --dur-base: 200ms;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --blue-500: oklch(0.630 0.192 258);
      --blue-50:  oklch(0.300 0.062 267);
      --grey-900: oklch(1 0 0);
      --grey-800: oklch(0.919 0.001 286);
      --grey-700: oklch(0.818 0.004 286);
      --grey-600: oklch(0.701 0.009 286);
      --grey-500: oklch(0.596 0.014 286);
      --grey-400: oklch(0.500 0.017 286);
      --grey-200: oklch(0.361 0.019 285);
      --grey-100: oklch(0.297 0.016 285);
      --background: oklch(0.207 0.010 286);
      --grey-background: oklch(0.174 0.006 286);
      --layered: oklch(0.247 0.013 285);
      --hairline: oklch(0.361 0.019 285);
      --press: oklch(1 0 0 / 0.06);
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--grey-background); color: var(--grey-900);
    font: 400 15px/1.5 var(--font); letter-spacing: -0.005em;
    -webkit-font-smoothing: antialiased;
  }

  /* top-app-bar */
  .top { position: sticky; top: 0; z-index: 1; height: 56px; display: flex; align-items: center;
         padding: 0 24px; background: var(--background); border-bottom: 1px solid var(--hairline); }
  .top h1 { margin: 0; font-size: 20px; font-weight: 700; line-height: 1.35; letter-spacing: -0.015em; }
  .top .count { margin-left: 8px; font-size: 13px; font-weight: 600; color: var(--blue-500);
                background: var(--blue-50); border-radius: 999px; padding: 2px 10px; font-variant-numeric: tabular-nums; }

  main { max-width: 1080px; margin: 0 auto; padding: 24px; display: grid;
         grid-template-columns: 320px 1fr; gap: 16px; align-items: start; }
  @media (max-width: 760px) { main { grid-template-columns: 1fr; padding: 16px; } }

  .card { background: var(--layered); border-radius: 24px; padding: 8px 0; }
  .list-header { padding: 16px 24px 8px; font-size: 13px; font-weight: 600; color: var(--grey-600); }

  /* list-row */
  #list { list-style: none; margin: 0; padding: 0 8px 8px; }
  .row { display: flex; align-items: center; gap: 14px; min-height: 64px; padding: 10px 16px;
         border-radius: 16px; cursor: pointer; transition: background var(--dur-base) var(--ease); }
  .row:hover { background: var(--press); }
  .row.active { background: var(--grey-100); }
  .row:focus-visible { outline: 1.5px solid var(--blue-500); outline-offset: -1.5px; }
  .avatar { width: 44px; height: 44px; flex: none; border-radius: 14px; background: var(--blue-50);
            color: var(--blue-500); display: grid; place-items: center; }
  .meta { flex: 1; min-width: 0; }
  .meta .title { font-size: 17px; font-weight: 600; line-height: 1.45; letter-spacing: -0.01em;
                 white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta .sub { font-size: 13px; color: var(--grey-600); font-variant-numeric: tabular-nums; }

  /* icon-button: 40px hit area, 24px 아이콘 */
  .icon-btn { width: 40px; height: 40px; flex: none; display: grid; place-items: center; border-radius: 12px;
              color: var(--grey-600); transition: background var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease); }
  .icon-btn:hover { background: var(--grey-100); color: var(--blue-500); }
  .icon-btn:active { background: var(--grey-200); }
  svg.i { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.6;
          stroke-linecap: round; stroke-linejoin: round; }

  /* 본문 뷰어 */
  /* 뷰어: 요약·기사 하나하나를 카드로 */
  #view { min-height: 360px; overflow-wrap: anywhere; display: flex; flex-direction: column; gap: 12px; }
  #view h1 { overflow-wrap: normal; word-break: keep-all; margin: 8px 4px 4px; font-size: 24px; font-weight: 700; line-height: 1.3; letter-spacing: -0.02em; }
  @media (max-width: 760px) { #view h1 { font-size: 20px; } }
  #view h2 { margin: 16px 8px 0; font-size: 13px; font-weight: 600; color: var(--grey-600); letter-spacing: 0; }
  #view h3 { margin: 0 0 8px; font-size: 18px; font-weight: 600; line-height: 1.45; letter-spacing: -0.01em; }
  #view p { margin: 0 0 8px; color: var(--grey-700); }
  #view ol { margin: 0; padding: 20px 24px 20px 44px; background: var(--layered); border-radius: 24px; }
  #view ol li { margin: 6px 0; color: var(--grey-800); }
  #view ol li::marker { color: var(--blue-500); font-weight: 700; font-variant-numeric: tabular-nums; }
  #view .item { background: var(--layered); border-radius: 24px; padding: 24px;
                transition: box-shadow var(--dur-base) var(--ease); }
  #view .item:hover { box-shadow: var(--shadow-1); }
  #view .item .num { display: inline-block; margin-bottom: 10px; padding: 2px 10px; border-radius: 999px;
                     background: var(--blue-50); color: var(--blue-500); font-size: 12px; font-weight: 600;
                     font-variant-numeric: tabular-nums; }
  #view .item p:last-of-type { margin-bottom: 12px; }
  #view > .empty { background: var(--layered); border-radius: 24px; }
  #view a { color: var(--blue-500); text-decoration: none; font-weight: 600; }
  #view a:hover { text-decoration: underline; }
  #view a.source { display: inline-flex; align-items: center; gap: 4px; margin-top: 4px; font-size: 13px; }

  .empty { padding: 48px 24px; text-align: center; color: var(--grey-500); }
</style>
</head>
<body>
<header class="top"><h1>다이제스트</h1><span class="count" id="count" hidden></span></header>
<main>
  <section class="card" aria-label="파일 목록">
    <div class="list-header">파일</div>
    <ul id="list"><li class="empty">불러오는 중이에요</li></ul>
  </section>
  <article id="view"><p class="empty">왼쪽에서 파일을 골라 주세요</p></article>
</main>

<svg width="0" height="0" style="position:absolute">
  <symbol id="i-doc" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="M12 4v12M7 11l5 5 5-5M5 20h14"/></symbol>
</svg>

<script>
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const inline = s => esc(s)
  .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
  .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
  .replace(/(^|[\s:])(https?:\/\/[^\s<]+)/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>');

// 다이제스트에 쓰는 정도의 간단한 마크다운만 처리. ### 단위로 기사 블록을 묶는다.
function render(md) {
  let out = '', list = null, inItem = false, idx = 0;
  const closeList = () => { if (list) { out += `</${list}>`; list = null; } };
  const closeItem = () => { closeList(); if (inItem) { out += '</div>'; inItem = false; } };
  for (const line of md.split(/\r?\n/)) {
    let m;
    if ((m = line.match(/^(#{1,6})\s+(.*)/))) {
      const n = m[1].length;
      closeItem();
      if (n === 3) { out += `<div class="item"><span class="num">기사 ${++idx}</span>`; inItem = true; }
      out += `<h${n}>${inline(m[2])}</h${n}>`;
    }
    else if ((m = line.match(/^원문:\s*(https?:\/\/\S+)/))) {
      closeList();
      out += `<a class="source" href="${esc(m[1])}" target="_blank" rel="noopener">원문 보기 ›</a>`;
    }
    else if ((m = line.match(/^\d+\.\s+(.*)/))) { if (list !== 'ol') { closeList(); out += '<ol>'; list = 'ol'; } out += `<li>${inline(m[1])}</li>`; }
    else if ((m = line.match(/^[-*]\s+(.*)/))) { if (list !== 'ul') { closeList(); out += '<ul>'; list = 'ul'; } out += `<li>${inline(m[1])}</li>`; }
    else if (line.trim() === '') { closeList(); }
    else { closeList(); out += `<p>${inline(line)}</p>`; }
  }
  closeItem();
  return out;
}

async function open(name, li) {
  document.querySelectorAll('#list .row').forEach(x => x.classList.remove('active'));
  li.classList.add('active');
  const view = document.getElementById('view');
  const res = await fetch('files/' + encodeURIComponent(name));
  view.innerHTML = res.ok ? render(await res.text()) : '<p class="empty">파일을 열 수 없어요</p>';
}

(async () => {
  const ul = document.getElementById('list');
  try {
    const files = await (await fetch('files.json', { cache: 'no-store' })).json();
    if (!files.length) { ul.innerHTML = '<li class="empty">아직 파일이 없어요</li>'; return; }
    const count = document.getElementById('count');
    count.textContent = files.length; count.hidden = false;
    ul.innerHTML = '';
    for (const f of files) {
      const li = document.createElement('li');
      li.className = 'row'; li.tabIndex = 0;
      const href = 'files/' + encodeURIComponent(f.name);
      li.innerHTML = `
        <span class="avatar"><svg class="i"><use href="#i-doc"/></svg></span>
        <span class="meta"><div class="title">${esc(f.name.replace(/\.md$/, ''))}</div>
          <div class="sub">${(f.size / 1024).toFixed(1)}KB · 마크다운</div></span>
        <a class="icon-btn" href="${href}" download aria-label="${esc(f.name)} 내려받기"><svg class="i"><use href="#i-down"/></svg></a>`;
      li.querySelector('.icon-btn').addEventListener('click', e => e.stopPropagation());
      li.addEventListener('click', () => open(f.name, li));
      li.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(f.name, li); } });
      ul.appendChild(li);
    }
    ul.firstElementChild.click();
  } catch { ul.innerHTML = '<li class="empty">목록을 불러오지 못했어요</li>'; }
})();
</script>
</body>
</html>
